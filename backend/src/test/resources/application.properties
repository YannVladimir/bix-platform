# Test-only configuration. This overrides src/main/resources/application.properties
# on the test classpath so the test suite runs against an in-memory H2 database
# instead of requiring a live Postgres instance and real secrets.

spring.datasource.url=jdbc:h2:mem:bixtest;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Not a real secret - only used to sign tokens during the test run.
app.jwt.secret=test-only-jwt-signing-secret-not-for-production-use-0123456789
app.jwt.expiration=86400000
